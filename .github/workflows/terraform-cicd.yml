name: Terraform IaC Pipeline

# Trigger on pushes to main or any PR targeting main — but only when
# files under terraform/ are actually changed. This prevents wasted
# runner minutes when only frontend assets are modified.
on:
  push:
    branches: [main]
    paths: ["terraform/**"]
  pull_request:
    branches: [main]
    paths: ["terraform/**"]

# Zero-Trust OIDC permissions:
#   id-token: write  — allows the runner to request a short-lived JWT from
#                      GitHub's OIDC provider and exchange it for AWS STS creds
#   contents: read   — checkout only; no write access to the repository
#   pull-requests: write — required for posting/overwriting plan comments on PRs
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    # All `run:` steps execute inside the terraform/ subdirectory so every
    # terraform command operates on the root module without explicit -chdir flags.
    defaults:
      run:
        working-directory: terraform

    steps:
      # ──────────────────────────────────────────────────────────────────────
      # ENVIRONMENT SETUP
      # ──────────────────────────────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Pessimistic constraint: allow any 1.x patch ≥ 1.9.0
          terraform_version: "~> 1.9"

      # ──────────────────────────────────────────────────────────────────────
      # GATE 1 — FORMAT CHECK
      # Runs BEFORE AWS credentials are configured so formatting problems are
      # caught immediately without waiting for OIDC token exchange.
      # Non-zero exit stops the job; no downstream steps run.
      # ──────────────────────────────────────────────────────────────────────

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      # ──────────────────────────────────────────────────────────────────────
      # GATE 2 — AWS AUTH + INIT + VALIDATE
      # OIDC federation: no static AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      # values appear anywhere in this file. STS issues a short-lived token
      # scoped to the deployment role for the duration of this run only.
      # ──────────────────────────────────────────────────────────────────────

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-south-1
          # Non-repudiation: the run ID makes every STS session traceable in
          # CloudTrail back to this exact GitHub Actions workflow run.
          role-session-name: terraform-${{ github.run_id }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      # ──────────────────────────────────────────────────────────────────────
      # GATE 3 — CHECKOV SECURITY SCAN (shift-left IaC SAST)
      # HIGH / CRITICAL findings → non-zero exit → pipeline stops here.
      # MEDIUM / LOW findings    → --soft-fail-on emits warning annotations
      #                            but returns exit code 0 so the pipeline
      #                            continues to plan/apply.
      # Intentional architectural waivers are suppressed inline in .tf files
      # with `# checkov:skip=CKV_ID:Reason` referencing the relevant ADR.
      # ──────────────────────────────────────────────────────────────────────

      - name: Install checkov
        # Quotes around checkov>=3.2 are required so the shell does not
        # interpret >= as an output-redirection operator.
        run: pip install "checkov>=3.2"

      - name: Run checkov (block on HIGH/CRITICAL)
        run: |
          checkov -d . \
            --framework terraform \
            --soft-fail-on MEDIUM,LOW \
            --compact \
            --output cli

      # ──────────────────────────────────────────────────────────────────────
      # GATE 4 — TERRAFORM PLAN  (pull_request events only)
      # Sensitive variables flow: GitHub Secret → TF_VAR_* env var →
      # sensitive=true Terraform variable → redacted in plan output.
      # No plaintext secrets appear in any .tf or .tfvars file.
      #
      # continue-on-error: true ensures the comment step always runs even
      # when plan exits with code 2 (changes detected) or 1 (error), so the
      # PR always receives a status comment rather than silently failing.
      # ──────────────────────────────────────────────────────────────────────

      - name: terraform plan
        id: plan
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}

      - name: Post plan comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // ── Resolve plan outcome ──────────────────────────────────────
            // Exit codes: 0 = no changes, 1 = error, 2 = changes pending.
            // GitHub Actions exposes the step outcome as "success" / "failure"
            // when continue-on-error is set; we use the raw exit code via the
            // steps context for a more precise status label.
            const outcome = '${{ steps.plan.outcome }}';
            const exitCode = '${{ steps.plan.outputs.exitcode }}';

            let statusEmoji;
            let statusLabel;
            if (outcome === 'failure') {
              statusEmoji = '❌';
              statusLabel = 'Plan failed (exit code 1 — check logs for errors)';
            } else if (exitCode === '2') {
              statusEmoji = '⚠️';
              statusLabel = 'Changes detected (exit code 2 — review diff below)';
            } else {
              statusEmoji = '✅';
              statusLabel = 'No changes — infrastructure is up-to-date (exit code 0)';
            }

            // ── Build comment body ────────────────────────────────────────
            // The hidden HTML marker <!-- terraform-plan --> is used as a
            // stable anchor to find and overwrite previous plan comments on
            // re-triggered PR runs, avoiding comment spam.
            const MAX_PLAN_LENGTH = 65000; // GitHub comment body limit is ~65536 chars
            let planOutput = `${{ steps.plan.outputs.stdout }}` || '(no output)';
            if (planOutput.length > MAX_PLAN_LENGTH) {
              planOutput =
                planOutput.substring(0, MAX_PLAN_LENGTH) +
                '\n\n... [output truncated — see full log in Actions tab]';
            }

            const body = [
              '<!-- terraform-plan -->',
              '### Terraform Plan',
              '',
              `**Status:** ${statusEmoji} ${statusLabel}`,
              '',
              '<details>',
              '<summary>Plan output (click to expand)</summary>',
              '',
              '```hcl',
              planOutput,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by commit \`${{ github.sha }}\` on branch \`${{ github.head_ref }}\`*`,
            ].join('\n');

            // ── Find existing plan comment to overwrite ───────────────────
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(
              (c) =>
                c.user.login === 'github-actions[bot]' &&
                c.body.startsWith('<!-- terraform-plan -->')
            );

            if (existingComment) {
              // Overwrite the previous plan comment so the PR thread stays clean
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              core.info(`Updated existing plan comment (id: ${existingComment.id})`);
            } else {
              // First plan run on this PR — create the comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created new plan comment on PR');
            }

            // Propagate the plan failure so the overall job still fails even
            // though continue-on-error was set on the plan step.
            if (outcome === 'failure') {
              core.setFailed('terraform plan failed — see plan comment for details');
            }

      # ──────────────────────────────────────────────────────────────────────
      # GATE 5 — TERRAFORM APPLY  (push to main only)
      # Only runs when a commit lands on main (i.e. a PR is merged).
      # The same sensitive-variable flow as the plan step is used here.
      # OIDC credentials from Gate 2 are still in scope for this step.
      # CRITICAL: no static AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY values
      # appear anywhere in this file — authentication is exclusively via OIDC.
      # ──────────────────────────────────────────────────────────────────────

      - name: terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
