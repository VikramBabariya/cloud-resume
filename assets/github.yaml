      pipeline_automation_and_devsecops: "GitHub Actions, Multi-Stage Docker Builds, Container Hardening (PoLP, Non-Root), Semantic Validation (ajv-cli, yamllint)."
      finops_and_observability: "AWS CloudWatch, Budget Hard-Capping (₹500 INR/mo limit enforcement), Immutable Infrastructure Patterns."
      backend_execution: "Python, Node.js, FastAPI, Django, PostgreSQL."
    flagship_infrastructure:
      - project: "Zero-Trust Resume-as-Code (RaC) Platform"
        architecture: "Serverless AWS delivery pipeline enforcing blast radius containment via OIDC identity federation, completely deprecating vulnerable, long-lived IAM keys."
        outcome: "Guaranteed flawless artifact hygiene and zero-downtime delivery utilizing idempotent S3 state synchronizations and automated CloudFront edge network invalidations."
      - project: "Inventory System: Containerized Defense-in-Depth → Kubernetes Migration"
        architecture: "Multi-tier Docker bridge networking → full Kubernetes migration (11 manifests, dedicated namespace, ClusterIP/NodePort topology, PVC-backed PostgreSQL, ConfigMap schema injection). Zero plaintext credentials across all manifests via secretKeyRef. Validated locally on k3d, targeting k3s on OCI ARM64."
        outcome: "Slashed production Docker artifacts by 90% (3.5 GB → 364 MB). Property-based manifest test suite (6 Hypothesis tests) enforces structural correctness shift-left — no live cluster required to gate correctness."
    current_architectural_sprint: "Completed local Kubernetes deployment of the Inventory System on k3d — 11 manifests, zero-plaintext credentials, property-based manifest validation. Next phase: provisioning OCI ARM64 VM (Always Free A1.Flex, 4 OCPUs / 24GB RAM), installing k3s, and deploying all four services to the live cluster. CI/CD pipeline for automated image build → GHCR push → kubectl apply is the subsequent gate."
