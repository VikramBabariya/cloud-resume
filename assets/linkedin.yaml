    content: >
      Over the past year, I took an Strategic Sabbatical to formally bridge my transition from a Python backend foundation into high-availability infrastructure engineering. Instead of just updating a PDF, I decided to build a production-grade, serverless application that acts as a live demonstration of Site Reliability Engineering (SRE) and DevSecOps competencies. 
      Today, I’m launching my Zero-Trust Resume-as-Code (RaC) Platform. This isn't just a portfolio; it's a mathematically enforced, SRE-hardened edge architecture. 
      Here are the core engineering pillars behind the build: 
      🔒 Zero-Trust Identity: I mathematically enforced blast radius containment by completely deprecating long-lived IAM access keys, instead utilizing OIDC identity federation for 100% of GitHub Actions deployments. 
      ⚡ Shift-Left Quality Gates: To slash Mean Time To Recovery (MTTR) and eliminate pipeline compute waste, I architected strict "Fail Fast" data contracts using semantic validation frameworks (ajv-cli, yamllint) before any infrastructure is ever touched. 
      📉 FinOps & Layer 7 Security: I engineered the platform with lean economics, hard-capping the AWS serverless infrastructure at ₹500 INR/month to optimize Total Cost of Ownership (TCO) and mitigate Layer 7 Denial-of-Wallet vulnerabilities. 
      ♻️ Idempotent Deployments: The pipeline guarantees artifact hygiene and zero-downtime delivery by orchestrating idempotent S3 state synchronizations (--delete) paired with automated CloudFront edge cache invalidations. 
      I am actively seeking my next role as a DevOps Engineer where I can bring this execution-focused mindset to an enterprise team. 
      🔗 Live Production Environment: https://vikram-sre.dev 
      🔗 GitHub Repository (Code, ADRs, & SRE Runbooks): https://lnkd.in/daEdxim5 
      For the Principal Engineers and Architects out there: I invite you to review my Architecture Decision Records (ADRs) or audit the codebase. If you can find a vulnerability, please report it via the structured disclosure protocol in my SECURITY.md !
