  - id: 1
    author: Vikram Babariya
    time_posted: 2h ago
    visibility: Visible to anyone on or off LinkedIn
    content: >
      2 weeks ago I wrote about IaC principles. Today I can share what it actually looks like when something breaks — and why that's the point. 
      I've just completed the full Terraform integration for my Zero-Trust RaC Platform. Every AWS and Cloudflare resource is now declared as code, peer-reviewed, and version-controlled. 
      The architecture spans 5 focused modules: 
      🗄️state-backend — S3 (SSE-KMS + versioning) + DynamoDB lock table 
      🌐cdn — Private S3 origin + OAC, ACM cert, CloudFront with HTTPS enforcement 
      ⚡compute — DynamoDB, Lambda (Python 3.12), API Gateway with CORS scoped to apex 
      🔗dns — Cloudflare CNAMEs (apex, www, ACM validation) — no more manual DR steps 
      🔒iam — Lambda execution role, GitHub OIDC provider, deployment role 
      But the real engineering story is in two incidents that happened during integration. 
      ——————————————————————————————————— 
      INC-001: The invisible secret mismatch 
      OIDC pipeline failed at Configure AWS Credentials with: "Credentials could not be loaded" 
      AWS masks errors intentionally. The actual cause: workflow referenced ${{ secrets.AWS_ROLE_ARN }} but the repo secret was AWS_DEPLOYMENT_ROLE_ARN. GitHub treats missing secrets as empty. AWS STS received a malformed request and returned a generic failure. 
      Lesson: Define your secrets naming convention before you provision. 
      ——————————————————————————————————— 
      INC-002: The OIDC trust policy blindspot 
      After adding src/lambda/** to CI path triggers, every PR failed: "Not authorized to perform sts:AssumeRoleWithWebIdentity" 
      GitHub issues different JWT sub claims: 
      • push to main → repo:org/repo:ref:refs/heads/main 
      • pull_request → repo:org/repo:pull_request 
      My trust policy only permitted the first pattern. PRs had always been opened but never triggered the Terraform pipeline — stayed hidden until the path filter exposed it. 
      Fix: two-statement IAM trust policy (push/apply + PR/plan). 
      Defense-in-depth at workflow level: terraform apply has an if: github.event_name == 'push' gate regardless of trust policy. Pipeline was broken (chicken-and-egg), so I applied the fix via terraform apply -target=module.iam. Surgical blast radius. 
      ——————————————————————————————————— 
      6 sequential CI gates: 
      1️⃣ terraform fmt — before credentials requested 
      2️⃣ OIDC + init + validate 
      3️⃣ checkov — HIGH/CRITICAL findings block 
      4️⃣ terraform plan — posted as PR comment 
      5️⃣ terraform apply — main only 
      6️⃣ Smoke tests — IAM policy simulation verifies permissions 
      Result: a single terraform apply fully reconstructs the platform. DR that previously required manual Cloudflare, ACM, and IAM steps is a pipeline run. 
      What's your approach to OIDC trust policy design for multi-event pipelines? Curious if the two-statement pattern is common or if there's a cleaner alternative.
