  - id: 6
    author: Vikram Babariya
    time_posted: 5mo ago
    visibility: Visible to anyone on or off LinkedIn
    content: >
      I spent a year building applications before I realized I was blind to the infrastructure running them. Time to fix that blind spot. 
      I’ve officially passed my AWS Certified Cloud Practitioner exam. ☁️ 
      Here is the biggest lesson I’ve learned about Cloud Infrastructure that I wish I fully grasped when I was strictly writing application code: 
      Your code doesn't just consume compute; it consumes capital. When you are building features locally, you rarely think about the financial cost of an unoptimized loop or a poorly indexed database. In the cloud, an inefficient architecture directly inflates your AWS bill. Understanding cloud economics and the Shared Responsibility Model completely changes how you design software from day one. 
      For me, this certification isn't just a badge to collect; it is the theoretical foundation for the systems I am actively building. It provided the exact structural knowledge I needed to design a serverless event-driven architecture with Lambda and DynamoDB, and I am currently applying these networking and security concepts to a containerized Docker and PostgreSQL system. 
      To the Cloud Architects and SREs in my network: What was your biggest "aha" moment when you first transitioned from application development to cloud infrastructure? Let’s discuss in the comments. 👇
